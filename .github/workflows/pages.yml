name: Publish Pokémon RPG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract game files
        run: |
          mkdir -p site
          base64 --decode pokemon-rpg-v1.zip.b64 > /tmp/pokemon-rpg.zip
          unzip -q /tmp/pokemon-rpg.zip 'pokemon-rpg/*' -d /tmp/pokemon-rpg
          cp -R /tmp/pokemon-rpg/pokemon-rpg/. site/
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
